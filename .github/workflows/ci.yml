name: Run CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        # Keep the cache small (no prebuilt wheels, e.g. torch); off by default since v9.
        prune-cache: true

    - name: Install dependencies
      run: |
        uv sync --extra dev --extra torch --extra nn --extra jax --frozen

    - name: Check C extension build
      run: |
        uv run --extra dev --extra torch --extra nn --extra jax python -c "import xwr.capture._fast"

    - name: Lint with ruff
      run: |
        uv run --extra dev --extra torch --extra nn --extra jax ruff check ./src

    - name: Type check with pyright
      run: |
        uv run --extra dev --extra torch --extra nn --extra jax pyright ./src

    - name: Run tests
      run: |
        uv run --extra dev --extra torch --extra nn --extra jax pytest -ra -- tests
