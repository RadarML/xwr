site_name: XWR
site_url: https://radarml.github.io/xwr
repo_url: https://github.com/RadarML/xwr
repo_name: RadarML/xwr
nav:
  - XWR:
    - Home: index.md
    - Usage:
      - User Guide: usage.md
      - Hardware Setup: setup.md
      - Development: develop.md
    - High Level API: system.md
    - Constraints: constraints.md
    - ROS Node: ros.md
    - Firmware: firmware.md
  - Radar Processing:
    - rsp: rsp/index.md
    - rsp.numpy: rsp/numpy.md
    - rsp.torch: rsp/torch.md
    - rsp.jax: rsp/jax.md
    - xwr.nn: nn/index.md
  - Low Level API:
    - Capture Card:
      - API: dca/api.md
      - Defines: dca/defines.md
      - Types: dca/types.md
    - Radar:
      - API: radar/api.md
      - Defines: radar/defines.md
      - Commands: radar/common.md

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  icon:
    logo: material/antenna
    annotation: material/arrow-right-circle
  font:
    code: monospace
  features:
    - navigation.instant
    - navigation.expand
    - navigation.tabs
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: blue
    accent: deep purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: indigo
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: Switch to system preference

plugins:
- search
- autorefs
- llmstxt:
    full_output: llms-full.txt
    markdown_description: |
      `xwr` is a python library for real-time raw (I/Q) data capture from TI
      mmWave radars on linux. It provides a high-level capture system which
      configures and streams 4D spectrum data from a TI XWR radar paired with a
      DCA1000EVM capture card, a documented and type-annotated low-level
      interface to both the radar firmware and the capture card, a radar signal
      processing library with numpy, pytorch, and jax backends, and a
      preprocessing toolkit for neural network training.
    sections:
      "XWR":
      - index.md: Project overview, supported hardware, and installation
      - usage.md: User guide for operating system setup, radar configuration, and capturing data
      - setup.md: Hardware setup for the DCA1000EVM capture card and supported TI radar development boards
      - develop.md: Development environment setup, testing, and documentation
      - system.md: High level API - the XWRSystem capture interface and its XWRConfig/DCAConfig configuration
      - constraints.md: Documented and enforced constraints on radar configurations
      - ros.md: ROS 2 node wrapping the XWR data collection pipeline
      - firmware.md: Custom radar firmware versions and flashing instructions
      "Radar Processing":
      - rsp/index.md: Radar signal processing for batched 4D spectrum, and backend-agnostic types
      - rsp/numpy.md: Numpy (pyfftw-backed) radar signal processing implementation
      - rsp/torch.md: Pytorch radar signal processing implementation
      - rsp/jax.md: Jax radar signal processing implementation
      - nn/index.md: Radar preprocessing and data augmentation toolkit for neural network training
      "Low Level API: Capture Card":
      - dca/api.md: DCA1000EVM capture card interface and real-time streaming implementation
      - dca/defines.md: DCA1000EVM constants, enums, and other definitions
      - dca/types.md: DCA1000EVM API data types and packet parsing
      "Low Level API: Radar":
      - radar/api.md: Parameterized python interface for the TI demo MSS firmware
      - radar/defines.md: TI radar demo firmware common API defines
      - radar/common.md: Raw, individually documented radar firmware commands
- mkdocstrings:
    default_handler: python_xref
    handlers:
      python_xref:
        paths: [src]
        options:
          docstring_style: google
          relative_crossrefs: true
          separate_signature: true
          line_length: 80
          show_signature_annotations: true
          signature_crossrefs: true
          show_root_full_path: true
          show_root_members_full_path: true
          show_symbol_type_heading: true
          show_root_heading: true
          show_root_toc_entry: true
          heading_level: 1
          check_crossrefs_exclude:
          - "^torch\\.(.*)"
          - "^numpy\\.(.*)"
        inventories:
        - https://docs.python.org/3/objects.inv
        - https://numpy.org/doc/stable/objects.inv
        - https://radarml.github.io/abstract-dataloader/objects.inv
        - https://docs.pytorch.org/docs/stable/objects.inv
        - https://docs.jax.dev/en/latest/objects.inv

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - footnotes
